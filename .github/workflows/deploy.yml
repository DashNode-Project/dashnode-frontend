name: Deploy to Vercel

on:
  push:
    branches: [develop, main]   # automatic: develop -> staging, main -> production
  workflow_dispatch:            # manual: pick the branch in the "Run workflow" dropdown

concurrency:
  group: vercel-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Only main and develop can be deployed
        if: github.ref_name != 'main' && github.ref_name != 'develop'
        run: |
          echo "Branch '${{ github.ref_name }}' is not deployable. Use main or develop."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g vercel@latest

      - name: Deploy to production (main)
        if: github.ref_name == 'main'
        run: |
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

      - name: Deploy to staging (develop)
        if: github.ref_name == 'develop'
        run: |
          vercel pull --yes --environment=preview
          vercel build
          URL=$(vercel deploy --prebuilt)
          vercel alias set "$URL" "${{ vars.STAGING_DOMAIN }}"
